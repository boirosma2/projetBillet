openapi: 3.0.0
info:
  title: Ticketing Platform API
  description: API for managing events, tickets, and user authentication
  version: 1.0.0
  contact:
    name: SmartTicket Support
servers:
  - url: http://localhost:${PORT}/api
    description: Development server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [regular, admin]
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date-time
        venue_id:
          type: integer
          format: int64
        organizer_id:
          type: integer
          format: int64
        event_type_id:
          type: integer
          format: int64
        total_tickets:
          type: integer
        available_tickets:
          type: integer
        price:
          type: number
          format: float
        venue:
          $ref: '#/components/schemas/Venue'
        organizer:
          $ref: '#/components/schemas/Organizer'
        eventType:
          $ref: '#/components/schemas/EventType'
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
    
    Venue:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
        city_id:
          type: integer
          format: int64
        capacity:
          type: integer
        description:
          type: string
          nullable: true
        
    Organizer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        bio:
          type: string
          nullable: true
          
    EventType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
          
    Artist:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        genre:
          type: string
        bio:
          type: string
          nullable: true
    Ticket:
      type: object
      properties:
        id:
          type: integer
          format: int64
        event_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        purchase_date:
          type: string
          format: date-time
    Banner:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        image_path:
          type: string
        is_active:
          type: boolean
        event_id:
          type: integer
          format: int64
          nullable: true
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true
        display_order:
          type: integer
    
    BannerClick:
      type: object
      properties:
        id:
          type: integer
          format: int64
        banner_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
          nullable: true
        ip_address:
          type: string
        user_agent:
          type: string
        clicked_at:
          type: string
          format: date-time
    
    BannerStats:
      type: object
      properties:
        banner_id:
          type: integer
          format: int64
        banner_title:
          type: string
        total_clicks:
          type: integer
        clicks_by_day:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              clicks:
                type: integer
        clicks_by_user_type:
          type: array
          items:
            type: object
            properties:
              user_type:
                type: string
              clicks:
                type: integer
    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: johndoe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
        '400':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate a user and get an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get basic user information
      description: Get basic information about the currently authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get complete user profile
      description: Get comprehensive profile information for the currently authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                  is_active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /users/my/tickets:
    get:
      tags:
        - Users
        - Tickets
      summary: Get current user's tickets
      description: Retrieve all tickets purchased by the currently authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User's tickets retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    event_id:
                      type: integer
                    user_id:
                      type: integer
                    price_paid:
                      type: number
                      format: float
                    purchase_date:
                      type: string
                      format: date-time
                    status:
                      type: string
                    ticket_code:
                      type: string
                    event:
                      $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events:
    get:
      tags:
        - Events
      summary: Get all events
      description: Retrieve a list of all available events with venue, organizer, eventType and artists
      responses:
        '200':
          description: A list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    description:
                      type: string
                    date:
                      type: string
                      format: date-time
                    venue:
                      $ref: '#/components/schemas/Venue'
                    organizer:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                    eventType:
                      $ref: '#/components/schemas/EventType'
                    artists:
                      type: array
                      items:
                        $ref: '#/components/schemas/Artist'
                    total_tickets:
                      type: integer
                    available_tickets:
                      type: integer
                    price:
                      type: number
                    status:
                      type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    post:
      tags:
        - Events
      summary: Create a new event
      description: Add a new event to the system
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - date
                - venue_id
                - organizer_id
                - event_type_id
                - total_tickets
                - price
              properties:
                title:
                  type: string
                  example: Summer Music Festival
                description:
                  type: string
                  example: Annual music event featuring various artists
                date:
                  type: string
                  format: date-time
                  example: 2025-07-15T18:00:00Z
                venue_id:
                  type: integer
                  example: 1
                organizer_id:
                  type: integer
                  example: 1
                event_type_id:
                  type: integer
                  example: 1
                total_tickets:
                  type: integer
                  example: 1000
                available_tickets:
                  type: integer
                  example: 1000
                price:
                  type: number
                  format: float
                  example: 49.99
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
                  event:
                    $ref: '#/components/schemas/Event'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events/{id}:
    get:
      tags:
        - Events
      summary: Get event by ID
      description: Retrieve a specific event with all details
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      tags:
        - Events
      summary: Update event
      description: Update an existing event's information
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date-time
                venue_id:
                  type: integer
                organizer_id:
                  type: integer
                event_type_id:
                  type: integer
                price:
                  type: number
                  format: float
                status:
                  type: string
                  enum: [upcoming, ongoing, completed, cancelled]
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  event:
                    $ref: '#/components/schemas/Event'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Events
      summary: Delete event
      description: Delete an event and related data
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Event deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /events/{id}/artists:
    post:
      tags:
        - Events
      summary: Add artist to event
      description: Associate an artist with an event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - artist_id
                - position
              properties:
                artist_id:
                  type: integer
                  format: int64
                  example: 1
                position:
                  type: string
                  example: "Headliner"
                performance_time:
                  type: string
                  format: date-time
                  example: "2025-07-15T20:00:00Z"
      responses:
        '201':
          description: Artist added to event successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  artist:
                    $ref: '#/components/schemas/Artist'
        '404':
          description: Event or artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /events/{id}/artists/{artist_id}:
    put:
      tags:
        - Events
      summary: Update artist in event
      description: Update an artist's details in an event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
        - name: artist_id
          in: path
          required: true
          description: Artist ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: string
                  example: "Support"
                performance_time:
                  type: string
                  format: date-time
                  example: "2025-07-15T18:30:00Z"
      responses:
        '200':
          description: Artist updated in event successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  eventArtist:
                    type: object
        '404':
          description: Event, artist, or association not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Events
      summary: Remove artist from event
      description: Remove an artist from an event
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            format: int64
        - name: artist_id
          in: path
          required: true
          description: Artist ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Artist removed from event successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Event, artist, or association not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /tickets:
    post:
      tags:
        - Tickets
      summary: Purchase a ticket
      description: Purchase a ticket for an event
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_id
              properties:
                event_id:
                  type: integer
                  example: 1
      responses:
        '201':
          description: Ticket purchased successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  message:
                    type: string
        '400':
          description: No tickets available or already purchased
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /tickets/user:
    get:
      tags:
        - Tickets
      summary: Get current user's tickets
      description: Retrieve all tickets purchased by the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user's tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /tickets/{id}:
    get:
      tags:
        - Tickets
      summary: Get ticket by ID
      description: Retrieve a specific ticket's details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ticket ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '403':
          description: Unauthorized access to this ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a list of all users (admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Access denied - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a specific user's details (admin or self only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Unauthorized access to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      tags:
        - Users
      summary: Update user
      description: Update a user's information (admin or self only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [regular, admin]
                  description: Admin only field
                is_active:
                  type: boolean
                  description: Admin only field
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized access to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete a user (admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          description: Unauthorized - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /users/{id}/status:
    patch:
      tags:
        - Users
