  # Tickets API
  /tickets/buy:
    post:
      tags:
        - Tickets
      summary: Purchase a ticket
      description: Buy a ticket for an event (requires authentication)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_id
              properties:
                event_id:
                  type: integer
                  description: ID of the event to purchase a ticket for
                  example: 1
      responses:
        '201':
          description: Ticket purchased successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Ticket acheté avec succès"
                  ticket:
                    type: object
                    properties:
                      id:
                        type: integer
                      event_id:
                        type: integer
                      user_id:
                        type: integer
                      price_paid:
                        type: number
                      status:
                        type: string
                      ticket_code:
                        type: string
                      purchase_date:
                        type: string
                        format: date-time
        '400':
          description: Invalid request or no tickets available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tickets/user:
    get:
      tags:
        - Tickets
      summary: Get current user's tickets (alternative endpoint)
      description: Retrieve all tickets purchased by the currently authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User's tickets retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    event_id:
                      type: integer
                    user_id:
                      type: integer
                    price_paid:
                      type: number
                    purchase_date:
                      type: string
                      format: date-time
                    status:
                      type: string
                    ticket_code:
                      type: string
                    event:
                      $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                
  /tickets/{id}:
    get:
      tags:
        - Tickets
      summary: Get ticket by ID
      description: Retrieve a specific ticket by its ID (requires authentication)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: Ticket retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  event_id:
                    type: integer
                  user_id:
                    type: integer
                  price_paid:
                    type: number
                  purchase_date:
                    type: string
                    format: date-time
                  status:
                    type: string
                  ticket_code:
                    type: string
                  event:
